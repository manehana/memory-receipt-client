name: Android CD

# Builds a release APK on a self-hosted runner and publishes it as a GitHub
# Release asset. (We intentionally do NOT also upload it as a workflow artifact:
# the self-hosted runner's upload bandwidth is the bottleneck, and uploading the
# same APK twice roughly doubled the total time.)
#
# NOTE: checkout runs with clean: false so the persisted node_modules/ on the
# self-hosted runner survives between builds (the default clean:true would
# `git clean -ffdx` it away). The gitignored android/ folder is regenerated
# every build via `expo prebuild --clean` — reusing it caused stale native
# resources (e.g. old app icons) to ship in the APK.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Only one build per branch at a time — the runner shares a single persisted
# android/ working copy, so overlapping builds would clobber each other.
concurrency:
  group: android-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required for creating the GitHub Release

jobs:
  build:
    name: Build release APK
    runs-on: self-hosted

    steps:
      - name: Checkout (preserve generated android/ and node_modules/)
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: npm ci

      # Always re-run prebuild so app.json changes (icon, permissions, etc.)
      # are synced into the persisted android/ folder. --clean regenerates it
      # from scratch — android/ is pure prebuild output (gitignored), and the
      # Gradle caches that matter live in ~/.gradle, so this is cheap and
      # guarantees no stale native resources leak into the APK.
      - name: Sync Expo config to android/ (Expo prebuild)
        run: npx expo prebuild -p android --no-install --clean

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK with descriptive name
        id: apk
        shell: bash
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::Expected APK not found at $src"
            exit 1
          fi
          branch="${GITHUB_REF_NAME//\//-}"
          name="memory-receipt-${branch}-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mkdir -p artifacts
          cp "$src" "artifacts/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=artifacts/${name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Android build ${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            Automated Android release build.

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - APK: `${{ steps.apk.outputs.name }}` (debug-signed)
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
